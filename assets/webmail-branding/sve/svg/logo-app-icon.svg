<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <radialGradient id="bgGlow" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#361700" />
      <stop offset="100%" stop-color="#1E0C00" />
    </radialGradient>
    
    <!-- Flap Top Light Gradient -->
    <linearGradient id="flapLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7D1A" />
      <stop offset="50%" stop-color="#FF5D00" />
      <stop offset="100%" stop-color="#D94800" />
    </linearGradient>

    <!-- Bevel Highlights -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A2E" />
      <stop offset="100%" stop-color="#802D00" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="envelopeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bgGlow)" />

  <!-- Shadowed Envelope Group -->
  <g filter="url(#envelopeShadow)">
    <!-- Lower Body Outline Beveled -->
    <rect x="85" y="155" width="342" height="230" fill="none" stroke="url(#bevelLight)" stroke-width="15" stroke-linejoin="round" />
    
    <!-- Diagonal Fold Lines with Lighting -->
    <line x1="85" y1="385" x2="200" y2="260" stroke="url(#bevelLight)" stroke-width="15" stroke-linecap="round" />
    <line x1="427" y1="385" x2="312" y2="260" stroke="url(#bevelLight)" stroke-width="15" stroke-linecap="round" />

    <!-- Top Embossed Flap with Directional Light -->
    <polygon points="76,120 436,120 256,295" fill="url(#flapLight)" stroke="#AA4400" stroke-width="6" stroke-linejoin="round" />
    <!-- Bevel Facet Highlight -->
    <polygon points="76,120 256,120 256,295" fill="#FFFFFF" opacity="0.12" />
  </g>
</svg>
